name: Mensa menu & deploy

on:
  schedule:
    # UTC。平日の朝（ドイツ時間 6〜7 時頃）と昼前（10〜11 時頃）
    - cron: '17 5 * * 1-5'
    - cron: '23 9 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mensa-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Mensa menu
        if: github.event_name != 'push'
        run: node scripts/fetch-mensa.mjs

      - name: Commit menu data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mensa data/cafe
          git diff --cached --quiet || git commit -m "Update Mensa menu"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
